# Secret-scanning gate: prevents API keys / tokens from ever landing in a commit.
# The repo is public; a single leaked Google key has already burned us once
# (see docs/AUDIT_ZCODE_20261024.md). Install once per clone:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  # Cheap belt-and-braces block for the exact key format gitleaks might miss
  # if a custom rule set drifts: Google API keys are 39 chars, AIza-prefixed.
  - repo: local
    hooks:
      - id: block-google-api-key
        name: block-google-api-key
        entry: bash -c 'if git diff --cached -U0 | grep -E "^\+.*AIzaSy[A-Za-z0-9_-]{30,}"; then echo "REFUSING COMMIT: Google API key format detected in staged diff. Revoke + rotate, never commit."; exit 1; fi'
        language: system
        stages: [pre-commit]
