<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dispatch hero art</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10150c;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #10150c;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .copy {
        position: absolute;
        left: 6%;
        bottom: 14%;
        z-index: 2;
        max-width: 620px;
        color: #f2f4e4;
        font-family: Georgia, serif;
      }
      .copy h1 {
        margin: 0;
        font-size: 76px;
        line-height: 0.98;
        font-weight: 500;
        letter-spacing: -0.035em;
      }
      .copy p {
        margin: 22px 0 0;
        max-width: 470px;
        color: #c2cbae;
        font-family: Arial, sans-serif;
        font-size: 17px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <radialGradient id="sky" cx="72%" cy="28%" r="88%">
            <stop offset="0" stop-color="#28331d" />
            <stop offset="0.42" stop-color="#171f11" />
            <stop offset="1" stop-color="#0a0e07" />
          </radialGradient>
          <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.2">
            <stop offset="0" stop-color="#12170d" />
            <stop offset="0.3" stop-color="#232c19" />
            <stop offset="0.55" stop-color="#39452a" />
            <stop offset="0.78" stop-color="#27311c" />
            <stop offset="1" stop-color="#0e120a" />
          </linearGradient>
          <linearGradient id="stoneRim" x1="0" y1="0" x2="1" y2="0.4">
            <stop offset="0" stop-color="#b8c992" stop-opacity="0.42" />
            <stop offset="0.45" stop-color="#b8c992" stop-opacity="0.04" />
            <stop offset="1" stop-color="#b8c992" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#eef5d6" stop-opacity="0" />
            <stop offset="0.18" stop-color="#e7f1c8" stop-opacity="0.9" />
            <stop offset="0.55" stop-color="#f1f7db" />
            <stop offset="0.82" stop-color="#d9e7b4" stop-opacity="0.85" />
            <stop offset="1" stop-color="#eef5d6" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1a2312" />
            <stop offset="1" stop-color="#080b05" />
          </linearGradient>
          <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#cddf9e" stop-opacity="0.38" />
            <stop offset="0.4" stop-color="#8ea460" stop-opacity="0.12" />
            <stop offset="1" stop-color="#8ea460" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="beadHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#f4f9df" stop-opacity="0.9" />
            <stop offset="0.2" stop-color="#e7f1c8" stop-opacity="0.45" />
            <stop offset="0.55" stop-color="#b9cd8a" stop-opacity="0.1" />
            <stop offset="1" stop-color="#b9cd8a" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="haze" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#a7bd7c" stop-opacity="0.22" />
            <stop offset="0.55" stop-color="#6f8253" stop-opacity="0.06" />
            <stop offset="1" stop-color="#6f8253" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#141b0e" stop-opacity="0" />
            <stop offset="0.45" stop-color="#141b0e" stop-opacity="0.55" />
            <stop offset="0.75" stop-color="#10150c" stop-opacity="0.9" />
            <stop offset="1" stop-color="#10150c" stop-opacity="0" />
          </linearGradient>
          <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="40" />
          </filter>
          <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="18" />
          </filter>
          <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" />
          </filter>
          <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" />
          </filter>
          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
            <feComponentTransfer>
              <feFuncA type="table" tableValues="0 0.16" />
            </feComponentTransfer>
          </filter>
          <filter id="stoneGrain">
            <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="5" seed="12" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
            <feComponentTransfer>
              <feFuncR type="table" tableValues="0.35 0.65" />
              <feFuncG type="table" tableValues="0.35 0.65" />
              <feFuncB type="table" tableValues="0.35 0.65" />
              <feFuncA type="table" tableValues="0 1" />
            </feComponentTransfer>
          </filter>
          <filter id="roughEdge" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="4" seed="9" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <clipPath id="stoneClip">
            <path d="M1002 1000 C978 870 972 720 988 575 C1004 420 1030 255 1081 151 C1114 84 1178 55 1238 79 C1307 106 1346 184 1366 286 C1394 438 1400 626 1422 786 C1434 882 1452 954 1473 1000 Z" />
          </clipPath>
        </defs>

        <rect width="1600" height="1000" fill="url(#sky)" />

        <ellipse cx="1210" cy="480" rx="420" ry="420" fill="url(#haze)" filter="url(#blur40)" />
        <ellipse cx="1180" cy="840" rx="540" ry="200" fill="url(#haze)" opacity="0.6" filter="url(#blur40)" />

        <rect y="790" width="1600" height="210" fill="url(#floor)" />
        <ellipse cx="1210" cy="915" rx="430" ry="115" fill="url(#floorGlow)" opacity="0.55" filter="url(#blur18)" />

        <!-- the hour stone -->
        <g filter="url(#roughEdge)">
          <path
            d="M1002 1000 C978 870 972 720 988 575 C1004 420 1030 255 1081 151 C1114 84 1178 55 1238 79 C1307 106 1346 184 1366 286 C1394 438 1400 626 1422 786 C1434 882 1452 954 1473 1000 Z"
            fill="url(#stone)"
          />
        </g>
        <g clip-path="url(#stoneClip)" opacity="0.5" style="mix-blend-mode: overlay">
          <rect x="950" y="40" width="560" height="980" filter="url(#stoneGrain)" />
        </g>
        <path
          d="M1002 1000 C978 870 972 720 988 575 C1004 420 1030 255 1081 151 C1114 84 1178 55 1238 79"
          fill="none"
          stroke="url(#stoneRim)"
          stroke-width="6"
        />
        <!-- hairline cracks -->
        <g stroke="#0b0f08" stroke-width="1.2" fill="none" opacity="0.55">
          <path d="M1062 220 C1078 300 1068 380 1090 450 C1106 502 1102 560 1114 620" />
          <path d="M1300 300 C1284 380 1296 450 1276 520" />
          <path d="M1040 690 C1060 740 1050 800 1070 860" />
        </g>

        <!-- companion stone, almost lost in fog -->
        <path
          d="M1432 1000 C1422 920 1420 830 1428 750 C1438 660 1454 590 1478 548 C1500 510 1526 520 1536 562 C1550 620 1548 720 1554 810 C1559 890 1566 950 1574 1000 Z"
          fill="#1c2515"
          opacity="0.85"
        />

        <ellipse cx="1180" cy="985" rx="250" ry="26" fill="#050704" opacity="0.65" filter="url(#blur6)" />

        <!-- the seam -->
        <g clip-path="url(#stoneClip)">
          <path
            d="M1187 200 C1179 300 1176 390 1181 470 C1174 540 1173 620 1180 700 C1184 750 1182 780 1187 815 C1195 750 1198 700 1193 630 C1200 550 1202 470 1196 390 C1201 320 1198 250 1195 200 Z"
            fill="url(#seam)"
            filter="url(#blur3)"
            opacity="0.95"
          />
          <path
            d="M1189 235 C1183 330 1181 430 1185 510 C1180 590 1179 680 1184 770"
            fill="none"
            stroke="#f6fadf"
            stroke-width="2"
            opacity="0.9"
            filter="url(#blur3)"
          />
        </g>

        <!-- the minute, and the thread that carries it -->
        <path
          d="M1190 565 C1204 570 1218 590 1224 616"
          fill="none"
          stroke="#e8f2c8"
          stroke-width="1.3"
          opacity="0.75"
        />
        <circle cx="1228" cy="622" r="54" fill="url(#beadHalo)" />
        <circle cx="1228" cy="622" r="7" fill="#f6fae7" />
        <circle cx="1228" cy="622" r="2.6" fill="#ffffff" />

        <path d="M1180 792 L1020 1000 L1370 1000 Z" fill="#c9db98" opacity="0.055" filter="url(#blur18)" />
        <path d="M1185 792 L1110 1000 L1250 1000 Z" fill="#e3eec2" opacity="0.07" filter="url(#blur6)" />

        <!-- the figure -->
        <g>
          <g fill="#070a04">
            <circle cx="1049" cy="794" r="10.5" />
            <path d="M1033 812 Q1049 803 1065 812 L1073 868 L1064 870 L1060 908 L1053 908 L1050 874 L1047 908 L1040 908 L1036 870 L1027 868 Z" />
          </g>
          <path
            d="M1058 789 C1064 792 1067 799 1066 807 M1068 820 C1074 838 1073 858 1066 872"
            stroke="#b9ca93"
            stroke-width="1.6"
            fill="none"
            opacity="0.55"
          />
        </g>
        <ellipse cx="1050" cy="918" rx="26" ry="5" fill="#050704" opacity="0.55" filter="url(#blur6)" />

        <!-- mist across the floor and base -->
        <rect y="720" width="1600" height="280" fill="url(#fog)" opacity="0.85" />
        <ellipse cx="1180" cy="870" rx="500" ry="100" fill="#1a2312" opacity="0.45" filter="url(#blur40)" />

        <!-- dust -->
        <g fill="#dce8b5">
          <circle cx="1120" cy="260" r="1.6" opacity="0.4" />
          <circle cx="1270" cy="180" r="1.2" opacity="0.35" />
          <circle cx="1340" cy="420" r="1.8" opacity="0.3" />
          <circle cx="1080" cy="480" r="1.3" opacity="0.4" />
          <circle cx="1240" cy="700" r="1.5" opacity="0.3" />
          <circle cx="980" cy="620" r="1.1" opacity="0.3" />
          <circle cx="1420" cy="620" r="1.4" opacity="0.28" />
          <circle cx="1160" cy="380" r="1.1" opacity="0.35" />
          <circle cx="1300" cy="820" r="1.6" opacity="0.25" />
          <circle cx="1050" cy="220" r="1.2" opacity="0.25" />
        </g>

        <rect width="1600" height="1000" filter="url(#grain)" opacity="0.55" style="mix-blend-mode: soft-light" />
      </svg>

      <div class="copy">
        <h1>Keep the hour.<br />Post the minute.</h1>
        <p>Long sessions in. Short captioned clips out. You approve every one.</p>
      </div>
    </div>
  </body>
</html>
