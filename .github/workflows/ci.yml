name: CI

# Safe, offline checks only: curated Python unit suites, cloud-worker node tests,
# and frontend type-check + tests. No secrets, no live services, no Android/Gradle
# builds and no release/deploy scripts are executed here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-suites:
    name: Python 3.11 curated suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # IMPORTANT: DISPATCH_STORAGE_DIR / DISPATCH_DB_PATH are intentionally NOT set.
      # tests/__init__.py and dispatch/config.py detect the unittest runner and create a
      # throwaway storage dir + SQLite DB, so nothing can touch a real database.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only dependency: fastapi.testclient.TestClient needs httpx, which is
          # not part of the application runtime requirements.
          pip install "httpx>=0.27"

      - name: Run curated unit suites
        run: |
          python -m unittest \
            tests.test_dashboard_auth \
            tests.test_cluster_c_remediation \
            tests.test_security_hardening_20261028 \
            tests.test_transcript_persistence_20261028 \
            tests.test_rejection_reliability_20261028 \
            tests.test_edit_windows \
            tests.test_cloud_caption_reconciliation \
            tests.test_caption_range_sync \
            tests.test_caption_approval_contract \
            tests.test_gemini_two_stage \
            tests.test_phase3_highlights \
            tests.test_publication_stats \
            tests.test_sync_engine

  cloud-worker:
    name: Cloud worker (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run node tests
        run: npm test

  frontend:
    name: Frontend (tsc + npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
