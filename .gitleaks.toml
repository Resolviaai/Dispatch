# Gitleaks configuration for Dispatch CI secret scanning
title = "Dispatch Gitleaks Config"

[allowlist]
description = "Allowlist exact synthetic mock fixture tokens and hook definitions"
paths = [
    '''\.pre-commit-config\.yaml''',
]
stopwords = [
    "AIzaSyOriginalKey00000000000000000000",
    "AIzaSyTestKeyWithValidFormat0000000000000",
    "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
    "1//0gMockRefreshToken1234567890abcdef",
    "host_pc_secret_key_12345",
]
regexes = [
    '''AIzaSyOriginalKey00000000000000000000''',
    '''AIzaSyTestKeyWithValidFormat0000000000000''',
    '''AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA''',
    '''1//0gMockRefreshToken1234567890abcdef''',
    '''host_pc_secret_key_[0-9]+''',
]
