# Gitleaks configuration for Dispatch CI secret scanning
title = "Dispatch Gitleaks Config"

[allowlist]
description = "Ignore synthetic mock tokens in unit test fixtures and pre-commit checks"
paths = [
    '''tests/.*''',
    '''cloud-worker/test/.*''',
    '''\.pre-commit-config\.yaml''',
    '''android/app/src/main/assets/web/.*''',
]
regexes = [
    '''1//0gMockRefreshToken[0-9a-zA-Z]+''',
    '''AIzaSy[A-Za-z0-9_-]{30,}''',
    '''host_pc_secret_key_[0-9]+''',
]
