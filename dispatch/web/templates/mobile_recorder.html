<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dispatch Mobile Recorder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #070A0F;
            color: #F3F4F6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .record-pulse {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none overflow-hidden p-4">

    <!-- Top Status Bar -->
    <header class="flex items-center justify-between border-b border-white/10 pb-3 pt-1">
        <div class="flex items-center gap-2">
            <div id="conn-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
            <span id="conn-label" class="text-xs font-mono tracking-wider text-slate-400 uppercase">Laptop Connected</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="queue-badge" class="px-2 py-0.5 text-xs font-mono rounded bg-white/5 border border-white/10 text-slate-300">
                Outbox: 0
            </span>
            <span id="battery-indicator" class="text-xs font-mono text-slate-400">100%</span>
        </div>
    </header>

    <!-- Main Viewfinder Container -->
    <main class="relative flex-1 my-4 flex items-center justify-center rounded-2xl overflow-hidden bg-black/60 border border-white/10">
        <video id="viewfinder" autoplay playsinline muted class="w-full h-full object-cover"></video>

        <!-- Recording Active HUD Overlay -->
        <div id="hud-overlay" class="absolute top-4 left-4 right-4 flex items-center justify-between hidden">
            <div class="flex items-center gap-2 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-red-500/30">
                <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></div>
                <span id="timer-display" class="font-mono text-sm font-semibold tracking-wider text-red-400">00:00:00</span>
            </div>
            <div class="bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-mono text-slate-300">
                Segment <span id="seg-num">#1</span>
            </div>
        </div>

        <!-- Camera Off Empty State -->
        <div id="camera-placeholder" class="flex flex-col items-center justify-center text-center p-6 text-slate-500">
            <svg class="w-12 h-12 mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <p class="text-xs tracking-wider uppercase font-mono">Camera Standby</p>
            <p class="text-[11px] text-slate-600 mt-1 max-w-xs">Tap Start Recording to initialize camera and rolling crash-safe storage.</p>
        </div>
    </main>

    <!-- Bottom Controls & Outbox Progress -->
    <footer class="flex flex-col gap-3 pb-2">
        <!-- Live Upload Progress Card -->
        <div id="upload-status-card" class="bg-white/[0.02] border border-white/5 rounded-xl p-3 flex flex-col gap-1.5">
            <div class="flex items-center justify-between text-xs font-mono">
                <span id="sync-stage" class="text-slate-400">Sync Outbox Idle</span>
                <span id="sync-progress" class="text-slate-400">0%</span>
            </div>
            <div class="w-full bg-black/40 rounded-full h-1.5 overflow-hidden">
                <div id="sync-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Chunk Duration Selector -->
        <div class="flex items-center justify-center gap-1.5 pt-1">
            <span class="text-[10px] uppercase font-mono text-slate-500 mr-1">Chunk:</span>
            <button id="chunk-10m" onclick="setChunkDuration(10)" class="px-2.5 py-1 text-[11px] font-mono rounded bg-indigo-600 text-white font-medium shadow">10m</button>
            <button id="chunk-15m" onclick="setChunkDuration(15)" class="px-2.5 py-1 text-[11px] font-mono rounded bg-white/5 border border-white/10 text-slate-400 hover:text-white">15m</button>
            <button id="chunk-30m" onclick="setChunkDuration(30)" class="px-2.5 py-1 text-[11px] font-mono rounded bg-white/5 border border-white/10 text-slate-400 hover:text-white">30m</button>
        </div>

        <!-- Master Trigger Button -->
        <div class="flex items-center justify-center pt-2">
            <button id="btn-toggle" onclick="toggleRecording()" 
                    class="w-20 h-20 rounded-full border-4 border-white/20 bg-red-600 active:scale-95 transition-all flex items-center justify-center shadow-lg">
                <div id="btn-shape" class="w-7 h-7 rounded-full bg-white transition-all"></div>
            </button>
        </div>
        <p class="text-center text-[11px] font-mono text-slate-500">Autonomous Lead Miner Pipeline</p>
    </footer>

    <!-- IndexedDB Client-Side Resumable Sync Engine -->
    <script>
        const AUTH_TOKEN = "dispatch_paired_secret_default";
        let sliceDurationMinutes = 10;
        let sliceDurationMs = 10 * 60 * 1000; // Default 10-minute rolling chunks for POCO C65

        function setChunkDuration(mins) {
            if (isRecording) return; // locked during recording
            sliceDurationMinutes = mins;
            sliceDurationMs = mins * 60 * 1000;
            [10, 15, 30].forEach(m => {
                const btn = document.getElementById(`chunk-${m}m`);
                if (btn) {
                    if (m === mins) {
                        btn.className = "px-2.5 py-1 text-[11px] font-mono rounded bg-indigo-600 text-white font-medium shadow";
                    } else {
                        btn.className = "px-2.5 py-1 text-[11px] font-mono rounded bg-white/5 border border-white/10 text-slate-400 hover:text-white";
                    }
                }
            });
        }
        let mediaStream = null;
        let mediaRecorder = null;
        let isRecording = false;
        let sessionStartTime = null;
        let timerInterval = null;
        let currentSessionId = null;
        let currentSegmentIndex = 1;
        let db = null;

        // 1. Initialize IndexedDB for crash-safe local storage on phone
        const request = indexedDB.open("DispatchOutboxDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("segments")) {
                db.createObjectStore("segments", { keyPath: "segment_id" });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            updateOutboxBadge();
            startBackgroundSyncWorker();
        };

        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                const videoEl = document.getElementById("viewfinder");
                videoEl.srcObject = mediaStream;
                document.getElementById("camera-placeholder").classList.add("hidden");
                return true;
            } catch (err) {
                alert("Camera permission denied or camera not accessible: " + err);
                return false;
            }
        }

        async function toggleRecording() {
            if (!isRecording) {
                const ok = await initCamera();
                if (!ok) return;

                isRecording = true;
                currentSessionId = "sess_" + Date.now();
                currentSegmentIndex = 1;
                sessionStartTime = Date.now();

                // UI Updates
                document.getElementById("btn-toggle").classList.add("record-pulse", "border-red-400");
                document.getElementById("btn-shape").classList.replace("rounded-full", "rounded-md");
                document.getElementById("hud-overlay").classList.remove("hidden");
                document.getElementById("seg-num").innerText = "#" + currentSegmentIndex;

                timerInterval = setInterval(updateTimer, 1000);
                startSegmentRecorder();
            } else {
                stopRecording();
            }
        }

        function startSegmentRecorder() {
            if (!mediaStream) return;

            const mime = MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "video/webm";
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mime });
            const chunks = [];
            const segId = `${currentSessionId}_seg_${String(currentSegmentIndex).padStart(4, "0")}`;

            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: mime });
                if (blob.size > 0) {
                    await storeSegmentToOutbox(segId, currentSessionId, blob);
                }
                if (isRecording) {
                    currentSegmentIndex++;
                    document.getElementById("seg-num").innerText = "#" + currentSegmentIndex;
                    startSegmentRecorder();
                }
            };

            mediaRecorder.start();
            // Automatically roll into next segment after slice duration
            setTimeout(() => {
                if (isRecording && mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
            }, sliceDurationMs);
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(timerInterval);

            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }

            // UI Reset
            document.getElementById("btn-toggle").classList.remove("record-pulse", "border-red-400");
            document.getElementById("btn-shape").classList.replace("rounded-md", "rounded-full");
            document.getElementById("hud-overlay").classList.add("hidden");
            document.getElementById("camera-placeholder").classList.remove("hidden");
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const hrs = String(Math.floor(elapsed / 3600)).padStart(2, "0");
            const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, "0");
            const secs = String(elapsed % 60).padStart(2, "0");
            document.getElementById("timer-display").innerText = `${hrs}:${mins}:${secs}`;
        }

        async function storeSegmentToOutbox(segmentId, sessionId, blob) {
            const buffer = await blob.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const sha256 = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

            const tx = db.transaction("segments", "readwrite");
            const store = tx.objectStore("segments");
            store.put({
                segment_id: segmentId,
                session_id: sessionId,
                blob: blob,
                size_bytes: blob.size,
                sha256: sha256,
                created_at: Date.now()
            });

            tx.oncomplete = () => {
                updateOutboxBadge();
            };
        }

        function updateOutboxBadge() {
            if (!db) return;
            const tx = db.transaction("segments", "readonly");
            const countReq = tx.objectStore("segments").count();
            countReq.onsuccess = () => {
                document.getElementById("queue-badge").innerText = `Outbox: ${countReq.result}`;
            };
        }

        // 2. Background Sync Worker: uploads outbox segments chunk by chunk
        async function startBackgroundSyncWorker() {
            setInterval(async () => {
                if (!db) return;

                // Ping laptop
                try {
                    const ping = await fetch("/api/sync/ping");
                    if (ping.ok) {
                        document.getElementById("conn-dot").className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                        document.getElementById("conn-label").innerText = "Laptop Connected";
                    } else {
                        throw new Error();
                    }
                } catch {
                    document.getElementById("conn-dot").className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                    document.getElementById("conn-label").innerText = "Laptop Offline (Queued)";
                    return;
                }

                // Check outbox
                const tx = db.transaction("segments", "readonly");
                const store = tx.objectStore("segments");
                const req = store.openCursor();

                req.onsuccess = async (e) => {
                    const cursor = e.target.result;
                    if (!cursor) return;

                    const item = cursor.value;
                    await syncSegmentToLaptop(item);
                };
            }, 5000);
        }

        async function syncSegmentToLaptop(item) {
            const segId = item.segment_id;
            const totalSize = item.size_bytes;

            try {
                // Step 1: Init upload & query remote offset
                const initRes = await fetch("/api/sync/upload/init", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: item.session_id,
                        segment_id: segId,
                        filename: segId + ".mp4",
                        file_size_bytes: totalSize,
                        sha256_hash: item.sha256,
                        auth_token: AUTH_TOKEN
                    })
                });

                if (!initRes.ok) return;
                const initData = await initRes.json();
                let remoteOffset = initData.remote_offset;

                if (initData.status === "already_completed") {
                    deleteSegmentFromOutbox(segId);
                    return;
                }

                document.getElementById("sync-stage").innerText = `Uploading ${segId}`;
                const pct = Math.round((remoteOffset / totalSize) * 100);
                document.getElementById("sync-progress").innerText = `${pct}%`;
                document.getElementById("sync-bar").style.width = `${pct}%`;

                // Step 2: Upload remaining bytes
                const CHUNK_SIZE = 256 * 1024; // 256 KB slices
                while (remoteOffset < totalSize) {
                    const nextOffset = Math.min(remoteOffset + CHUNK_SIZE, totalSize);
                    const chunkBlob = item.blob.slice(remoteOffset, nextOffset);

                    const uploadRes = await fetch("/api/sync/upload/chunk", {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/octet-stream",
                            "x-segment-id": segId,
                            "x-upload-offset": String(remoteOffset),
                            "x-file-size": String(totalSize),
                            "x-sha256": item.sha256,
                            "x-session-id": item.session_id,
                            "x-auth-token": AUTH_TOKEN
                        },
                        body: chunkBlob
                    });

                    if (!uploadRes.ok) throw new Error("Chunk upload error");
                    const patchData = await uploadRes.json();
                    remoteOffset = patchData.remote_offset;

                    const p = Math.round((remoteOffset / totalSize) * 100);
                    document.getElementById("sync-progress").innerText = `${p}%`;
                    document.getElementById("sync-bar").style.width = `${p}%`;

                    if (patchData.status === "completed" && patchData.verified) {
                        deleteSegmentFromOutbox(segId);
                        document.getElementById("sync-stage").innerText = `Verified ${segId}`;
                        break;
                    }
                }
            } catch (err) {
                console.log("Upload paused or connection lost: ", err);
            }
        }

        function deleteSegmentFromOutbox(segId) {
            const tx = db.transaction("segments", "readwrite");
            tx.objectStore("segments").delete(segId);
            tx.oncomplete = () => {
                updateOutboxBadge();
            };
        }
    </script>
</body>
</html>
